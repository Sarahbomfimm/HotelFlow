<svg width="120" height="150" viewBox="0 0 120 150" fill="none" xmlns="http://www.w3.org/2000/svg" class="flow-bot">
  <defs>
    <linearGradient id="botGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C199" />
      <stop offset="100%" stop-color="#C49A6C" />
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A365D" />
      <stop offset="100%" stop-color="#0F2342" />
    </linearGradient>
    
    <style>
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
        100% { transform: translateY(0px); }
      }
      @keyframes blink {
        0%, 90%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      .bot-head {
        animation: float 4s ease-in-out infinite;
        transform-origin: center;
      }
      .bot-eye {
        animation: blink 5s infinite;
        transform-origin: 50% 48px; /* Ajuste o ponto de origem para o centro do olho */
      }
    </style>
  </defs>

  <g id="bot-body">
    <path d="M35 85 C35 75, 85 75, 85 85 L90 120 C90 125, 30 125, 30 120 Z" fill="url(#botGold)" />
    <path d="M40 100 Q 60 90, 80 100" stroke="#0C2240" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M42 106 Q 60 96, 78 106" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3" />
  </g>

  <g id="bot-head" class="bot-head">
    <rect x="20" y="40" width="6" height="16" rx="3" fill="#C49A6C" />
    <rect x="94" y="40" width="6" height="16" rx="3" fill="#C49A6C" />
    
    <rect x="24" y="25" width="72" height="48" rx="20" fill="#ffffff" />
    <rect x="29" y="30" width="62" height="38" rx="15" fill="url(#screenBg)" stroke="url(#botGold)" stroke-width="1.5" />
    
    <circle id="eye-left" class="bot-eye" cx="48" cy="48" r="4.5" fill="#ffffff" />
    <circle id="eye-right" class="bot-eye" cx="72" cy="48" r="4.5" fill="#ffffff" />
    
    <path d="M36 36 L44 36" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.2" />
  </g>
</svg>
